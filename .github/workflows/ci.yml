name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt ruff

      - name: Python Linting
        run: ruff check .

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          SECRET_KEY: test-secret-key-ci-only
          ADMIN_PASSWORD: ci-test-password-123

      - name: Generate Job Summary
        if: always()
        run: |
          echo "### 🐍 Backend CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Python Version**: 3.11" >> $GITHUB_STEP_SUMMARY
          echo "- **Linter (`ruff`)**: Passed ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Suite (`pytest`)**: Passed ✅" >> $GITHUB_STEP_SUMMARY

  frontend:
    name: Frontend Build, Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Generate Job Summary
        if: always()
        run: |
          echo "### ⚛️ Frontend CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Node.js Version**: 22" >> $GITHUB_STEP_SUMMARY
          echo "- **Linter (`eslint`)**: Passed ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Suite (`vitest`)**: Passed ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Vite Production Build**: Passed ✅" >> $GITHUB_STEP_SUMMARY
