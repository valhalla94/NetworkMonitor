name: Release Automation

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-gate:
    name: Pre-Release Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies & run tests
        working-directory: backend
        run: |
          pip install -r requirements.txt -r requirements-dev.txt ruff
          ruff check .
          pytest tests/ -v --tb=short
        env:
          SECRET_KEY: test-secret-key-ci-only
          ADMIN_PASSWORD: ci-test-password-123

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies, test & build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run test
          npm run build

  release:
    name: Create GitHub Release
    needs: test-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Release Notes & Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
